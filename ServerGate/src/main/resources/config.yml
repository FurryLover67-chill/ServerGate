# ============================ ServerGate ============================
# Общий пароль для входа на сервер. Игрок вводит его командой:  /gate <пароль>
#
# КАК ЗАДАТЬ ПАРОЛЬ:
#   Впишите пароль в поле "password" ниже и выполните /servergate reload
#   (или перезапустите сервер). Плагин сам превратит его в соль + хеш
#   (PBKDF2-HMAC-SHA256) и ОЧИСТИТ поле "password" - открытого пароля
#   в файле не останется.
#
# Любые символы поддерживаются (Unicode, пробелы, эмодзи).
# Чтобы YAML не сломался, пишите пароль в ОДИНАРНЫХ кавычках,
# а одинарную кавычку внутри пароля удваивайте:  'it''s my #pass: 1'
#
# Пока пароль не задан, ВХОД НА СЕРВЕР ЗАПРЕЩЁН всем (fail-closed).
password: 'ZHIDKIY'

# Служебные поля - не редактируйте вручную.
password-salt: ''
password-hash: ''

# Сколько неверных попыток разрешено ДО блокировки IP (счётчик по IP, а не по сессии).
max-attempts: 3

# На сколько секунд блокируется IP после исчерпания попыток.
ip-lockout-seconds: 300

# Сколько секунд даётся на ввод пароля после захода.
timeout-seconds: 60
# ВАЖНО для AuthMe: его таймаут логина (settings.restrictions.timeout, по умолчанию 30 с)
# начинается при заходе. Увеличьте его (например, до 180), иначе AuthMe
# кикнет игрока раньше, чем тот успеет ввести общий пароль.

# Пускать операторов без пароля? (не рекомендуется)
bypass-ops: false
# Для обхода пароля выдайте право servergate.bypass.

# Скрывать из консоли/лога строки "issued server command: /gate ..."
# (чтобы пароль не оседал в latest.log). Рекомендуется true.
hide-password-from-log: true

# Дополнительные команды (без "/"), разрешённые до ввода пароля.
# Для AuthMe ОСТАВЬТЕ ПУСТЫМ: сначала общий пароль, потом /login.
allowed-commands: []

# Сообщения (формат MiniMessage)
messages:
  title: '<red><bold>Закрытый сервер'
  subtitle: '<yellow>/gate [пароль]'
  prompt: '<yellow>Введите общий пароль командой: <white>/gate [пароль]'
  actionbar: '<yellow>Введите пароль: <white>/gate [пароль] <gray>(осталось <seconds> с)'
  chat-blocked: '<red>Писать в чат нельзя. Введите пароль командой: <white>/gate [пароль]'
  only-gate: '<red>Сначала введите пароль: <white>/gate [пароль]'
  empty: '<red>Укажите пароль: /gate [пароль]'
  already: '<green>Вы уже прошли проверку.'
  wrong: '<red>Неверный пароль. Осталось попыток: <attempts>'
  success: '<green>Пароль принят. Добро пожаловать!'
  kick-too-many: '<red>Слишком много неверных попыток.'
  kick-timeout: '<red>Время на ввод пароля истекло.'
  blocked: '<red>Слишком много неверных попыток. Повторите через <seconds> сек.'
  not-configured: '<red>Сервер не настроен: администратор не задал пароль.'
