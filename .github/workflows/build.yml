name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B clean package
        working-directory: ServerGate
      - uses: actions/upload-artifact@v4
        with:
          name: ServerGate
          path: ServerGate/target/ServerGate-*.jar
